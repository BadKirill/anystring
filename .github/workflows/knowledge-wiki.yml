# Manual wiki sync only (no commit/PR automation).
# Local docs/knowledge/ is the General Wiki snapshot used for indexing.
name: Knowledge wiki

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which external wiki to sync
        type: choice
        options:
          - github
          - notion
          - both
        default: github

permissions:
  contents: write

concurrency:
  group: knowledge-wiki
  cancel-in-progress: true

jobs:
  github-wiki:
    name: Sync GitHub Wiki
    if: ${{ inputs.target == 'github' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mirror knowledge → GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run knowledge:wiki

  notion-wiki:
    name: Sync Notion Wiki
    if: ${{ inputs.target == 'notion' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mirror knowledge → Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_ID: 3a57e1830c32800c8d3be98bdb534bc4
        run: |
          if [ -z "$NOTION_API_KEY" ]; then
            echo "NOTION_API_KEY not set"
            exit 1
          fi
          npm run knowledge:notion
