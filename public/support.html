<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1412" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Anystring — support</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1412;
        --surface: #16211d;
        --accent: #1ed760;
        --text: #e8f2ec;
        --muted: #8ba396;
      }
      body {
        margin: 0 auto;
        padding: 32px 20px 64px;
        max-width: 40rem;
        background-color: var(--bg);
        background-image: radial-gradient(
          ellipse 120% 90% at 50% 0%,
          #14201b 0%,
          transparent 70%
        );
        background-attachment: fixed;
        color: var(--text);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.6;
      }
      h1 {
        color: var(--accent);
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }
      h2 {
        margin: 0 0 6px;
        font-size: 1.1rem;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
      .lede {
        color: var(--muted);
      }
      .card {
        margin-top: 24px;
        padding: 14px 16px 16px;
        background: var(--surface);
        border-radius: 16px;
      }
      .card p {
        margin: 0;
      }
      .card .prompt {
        margin: 20px 0 6px;
        color: var(--muted);
      }
      .nav {
        margin-bottom: 28px;
      }
      .nav a {
        margin-right: 16px;
      }
    </style>
  </head>
  <body>
    <p class="nav">
      <a href="/">Home</a>
      <a href="/app/">Open tuner</a>
      <a href="/privacy.html">Privacy</a>
    </p>

    <h1>Support and feedback</h1>
    <p class="lede">
      Questions, bug reports, or ideas for Anystring — write anytime. No account required.
    </p>

    <div class="card">
      <h2>Email</h2>
      <p>
        <a href="mailto:support@anystring.app">support@anystring.app</a>
      </p>
      <p class="prompt">Prefer an issue tracker?</p>
      <h2>GitHub</h2>
      <p>
        <a href="https://github.com/BadKirill/anystring/issues"
          >github.com/BadKirill/anystring/issues</a
        >
      </p>
    </div>
  </body>
</html>
