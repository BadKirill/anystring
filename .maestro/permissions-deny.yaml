appId: com.badkirill.anystring
name: Mic permission denied → error copy (Android)
---
- launchApp:
    clearState: true
    permissions:
      all: deny
      microphone: deny
      android.permission.RECORD_AUDIO: deny
      android.permission.MODIFY_AUDIO_SETTINGS: allow
- extendedWaitUntil:
    visible: 'Anystring'
    timeout: 30000
- tapOn: 'Start tuning'
- extendedWaitUntil:
    visible: '.*record audio.*'
    timeout: 15000
- tapOn:
    id: 'com.android.permissioncontroller:id/permission_deny_button'
- extendedWaitUntil:
    visible: 'Start tuning'
    timeout: 15000
- assertNotVisible: 'Stop'
